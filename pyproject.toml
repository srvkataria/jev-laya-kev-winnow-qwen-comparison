[project]
name = "ticket-routing-poc"
version = "0.1.0"
description = "Route the same 200 support tickets through Qwen, Jev, Laya, and Kev 0.8B."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psutil>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
