<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyStories</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --card: #fffaf3;
      --ink: #1c140c;
      --brown: #3f2a1a;
      --cream: #f6f1e7;
      --line: #1c140c;
      --chip: #efe6d6;
      --focus: #8a3b12;
      --muted: #3f2a1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.4rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 28px;
      font-size: 1.15rem;
      line-height: 1.45;
    }

    label,
    .control-label,
    .status,
    button,
    input {
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font: 1.15rem/1.5 "Iowan Old Style", Palatino, Georgia, serif;
      resize: vertical;
    }

    textarea::placeholder { color: #5c4636; }

    textarea:focus,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .starters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 22px;
    }

    button {
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--brown);
      color: var(--cream);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #2a1b10; }

    button:disabled {
      background: #d7c7b0;
      color: var(--ink);
      cursor: not-allowed;
    }

    .starters button {
      background: var(--chip);
      color: var(--ink);
      padding: 8px 12px;
      font-weight: 650;
    }

    .starters button:hover { background: #e4d5bf; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--brown);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      padding: 12px 22px;
      font-size: 1.05rem;
    }

    .status {
      min-height: 1.4em;
      margin: 14px 0 0;
      font-weight: 700;
    }

    .story {
      margin-top: 28px;
      padding: 22px 22px 26px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }

    .story h2 {
      margin: 0 0 12px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .story p {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .story .continuation { display: inline; }

    @media (max-width: 640px) {
      main { padding-top: 24px; }
      h1 { font-size: 2rem; }
      .controls { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Write a story</h1>
    <p class="lede">This model writes short children's stories. It learned from TinyStories, so a simple opening works best.</p>

    <label class="field-label" for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Once upon a time"></textarea>
    <div class="starters" role="group" aria-label="Story starters">
      <button type="button" data-prompt="Once upon a time">Once upon a time</button>
      <button type="button" data-prompt="Lily found a red ball">Lily found a red ball</button>
      <button type="button" data-prompt="Timmy was afraid of the dark">Timmy was afraid of the dark</button>
    </div>

    <div class="controls">
      <div>
        <div class="control-label">
          <label for="length">Length</label>
          <span id="length-value">128 tokens</span>
        </div>
        <input id="length" type="range" min="32" max="256" step="16" value="128">
      </div>
      <div>
        <div class="control-label">
          <label for="temperature">Temperature</label>
          <span id="temperature-value">0.8</span>
        </div>
        <input id="temperature" type="range" min="0.2" max="1.2" step="0.1" value="0.8">
      </div>
    </div>

    <div class="actions">
      <button type="button" id="write">Write</button>
      <button type="button" id="again">Again</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="story" id="story" hidden>
      <h2>Story</h2>
      <p><span id="story-prompt"></span><span class="continuation" id="story-continuation"></span></p>
    </section>
  </main>

  <script>
    const promptEl = document.getElementById("prompt");
    const lengthEl = document.getElementById("length");
    const temperatureEl = document.getElementById("temperature");
    const lengthValue = document.getElementById("length-value");
    const temperatureValue = document.getElementById("temperature-value");
    const writeBtn = document.getElementById("write");
    const againBtn = document.getElementById("again");
    const statusEl = document.getElementById("status");
    const storyEl = document.getElementById("story");
    const storyPrompt = document.getElementById("story-prompt");
    const storyContinuation = document.getElementById("story-continuation");

    function syncControls() {
      lengthValue.textContent = lengthEl.value + " tokens";
      temperatureValue.textContent = Number(temperatureEl.value).toFixed(1);
    }

    lengthEl.addEventListener("input", syncControls);
    lengthEl.addEventListener("change", syncControls);
    temperatureEl.addEventListener("input", syncControls);
    temperatureEl.addEventListener("change", syncControls);
    syncControls();

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => {
        promptEl.value = button.dataset.prompt;
        promptEl.focus();
      });
    });

    function setBusy(busy) {
      writeBtn.disabled = busy;
      againBtn.disabled = busy;
      document.querySelectorAll("[data-prompt]").forEach((button) => {
        button.disabled = busy;
      });
    }

    async function readEvents(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";
        for (const chunk of chunks) {
          const line = chunk.split("\n").find((item) => item.startsWith("data: "));
          if (!line) continue;
          onEvent(JSON.parse(line.slice(6)));
        }
      }
    }

    async function writeStory() {
      const prompt = promptEl.value.trim();
      if (!prompt) {
        statusEl.textContent = "Write a prompt first.";
        promptEl.focus();
        return;
      }

      setBusy(true);
      storyEl.hidden = false;
      storyPrompt.textContent = prompt;
      storyContinuation.textContent = "";
      statusEl.textContent = "Writing…";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            max_tokens: Number(lengthEl.value),
            temperature: Number(temperatureEl.value),
          }),
        });

        if (!response.ok) {
          let message = "The model could not write a story.";
          try {
            const payload = await response.json();
            if (payload.error) message = payload.error;
          } catch (_err) {
            /* keep the fallback message */
          }
          throw new Error(message);
        }

        await readEvents(response, (event) => {
          if (typeof event.text === "string") storyContinuation.textContent = event.text;
          if (event.error) throw new Error(event.error);
        });
        statusEl.textContent = storyContinuation.textContent
          ? "Done."
          : "The model ended the story immediately. Try Again.";
      } catch (err) {
        statusEl.textContent = err.message || "The model could not write a story.";
      } finally {
        setBusy(false);
      }
    }

    writeBtn.addEventListener("click", writeStory);
    againBtn.addEventListener("click", writeStory);
    promptEl.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") writeStory();
    });
  </script>
</body>
</html>
